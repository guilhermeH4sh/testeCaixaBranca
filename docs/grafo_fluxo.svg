<svg width="680" height="820" viewBox="0 0 680 820" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Grafo de Fluxo — método verificarUsuario</title>
<desc>Grafo de fluxo com 10 nós e 11 arestas. V(G) = 3.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="680" height="820" fill="#ffffff"/>

<!-- Legenda -->
<rect x="40" y="18" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="30" font-family="Arial" font-size="12" fill="#333">Processo</text>
<rect x="160" y="18" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="180" y="30" font-family="Arial" font-size="12" fill="#333">Decisão</text>
<rect x="270" y="18" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="290" y="30" font-family="Arial" font-size="12" fill="#333">Resultado</text>
<rect x="390" y="18" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="410" y="30" font-family="Arial" font-size="12" fill="#333">Início / Fim</text>

<!-- Caixa complexidade -->
<rect x="490" y="55" width="165" height="80" rx="8" fill="#fff" stroke="#ccc" stroke-width="0.5"/>
<text x="572" y="75" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#222">V(G) = E − N + 2P</text>
<text x="572" y="93" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">E = 11 arestas</text>
<text x="572" y="108" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">N = 10 nós</text>
<text x="572" y="123" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#3C3489">V(G) = 3</text>

<!-- N1 Início -->
<rect x="255" y="58" width="170" height="40" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="83" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#2C2C2A">N1 — início</text>

<!-- N2 -->
<rect x="195" y="135" width="290" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="157" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#26215C">N2 — declarar sql = ""</text>
<text x="340" y="176" text-anchor="middle" font-family="Arial" font-size="11" fill="#3C3489">chamar conectarBD()</text>

<!-- N3 -->
<rect x="195" y="225" width="290" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="247" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#26215C">N3 — montar query SQL</text>
<text x="340" y="266" text-anchor="middle" font-family="Arial" font-size="11" fill="#993C1D">concatenação (SQL Injection)</text>

<!-- N4 Decisão -->
<rect x="200" y="315" width="280" height="54" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="337" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#412402">N4 — conn == null?</text>
<text x="340" y="356" text-anchor="middle" font-family="Arial" font-size="11" fill="#633806">risco de NullPointerException</text>

<!-- N5 -->
<rect x="195" y="405" width="290" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="427" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#26215C">N5 — try: createStatement()</text>
<text x="340" y="446" text-anchor="middle" font-family="Arial" font-size="11" fill="#3C3489">executeQuery(sql)</text>

<!-- N6 Decisão -->
<rect x="210" y="495" width="260" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="522" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#412402">N6 — rs.next()?</text>

<!-- N7 -->
<rect x="65" y="585" width="215" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="172" y="607" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#04342C">N7 — result = true</text>
<text x="172" y="626" text-anchor="middle" font-family="Arial" font-size="11" fill="#085041">nome = rs.getString("nome")</text>

<!-- N8 catch -->
<rect x="390" y="585" width="210" height="54" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="495" y="607" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#4A1B0C">N8 — catch (Exception e)</text>
<text x="495" y="626" text-anchor="middle" font-family="Arial" font-size="11" fill="#993C1D">bloco vazio — engole erro</text>

<!-- N9 return -->
<rect x="210" y="685" width="260" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="712" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#04342C">N9 — return result</text>

<!-- N10 fim -->
<rect x="255" y="765" width="170" height="32" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="786" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#2C2C2A">N10 — fim</text>

<!-- ARESTAS -->
<line x1="340" y1="98" x2="340" y2="135" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="189" x2="340" y2="225" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="279" x2="340" y2="315" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="369" x2="340" y2="405" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<text x="350" y="392" font-family="Arial" font-size="10" fill="#555">não null</text>
<!-- N4 null path -->
<path d="M200 342 L105 342 L105 707 L210 707" fill="none" stroke="#E24B4A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="40" y="330" font-family="Arial" font-size="10" fill="#E24B4A">null →</text>
<text x="40" y="343" font-family="Arial" font-size="10" fill="#E24B4A">NPE</text>
<!-- N5 -> N6 -->
<line x1="340" y1="459" x2="340" y2="495" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<!-- N6 -> N7 true -->
<path d="M210 517 L172 517 L172 585" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<text x="118" y="508" font-family="Arial" font-size="10" fill="#555">true</text>
<!-- N6 -> N8 false -->
<path d="M470 517 L495 517 L495 585" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<text x="472" y="508" font-family="Arial" font-size="10" fill="#555">false</text>
<!-- N5 -> N8 exception -->
<path d="M485 405 L590 405 L590 612 L600 612" fill="none" stroke="#E24B4A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="592" y="400" font-family="Arial" font-size="10" fill="#E24B4A">exception</text>
<!-- N7 -> N9 -->
<path d="M172 639 L172 707 L210 707" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<!-- N8 -> N9 -->
<path d="M495 639 L495 707 L470 707" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<!-- N9 -> N10 -->
<line x1="340" y1="729" x2="340" y2="765" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
</svg>
